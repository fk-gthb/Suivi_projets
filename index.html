<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi projets</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icone_192.png">
<link rel="apple-touch-icon" href="icone_apple.png">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projets">
<style>
  :root{--bg:#f3f5f7;--card:#fff;--sunk:#e8ecf0;--ink:#17212b;--muted:#5b6876;--line:#d9dfe5;--accent:#1f4e79;--accent-soft:#dbe6f1;--accent-ink:#fff;
    --ok:#1f7a4d;--ok-soft:#dcefe4;--warn:#a15c00;--warn-soft:#f6e8cf;--bad:#b3261e;--bad-soft:#f6dcda;--info:#5a4fa3;--info-soft:#e5e2f5}
  @media (prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#16202a;--sunk:#1d2935;--ink:#e4eaf0;--muted:#97a6b5;--line:#2b3a48;--accent:#8db8e3;--accent-soft:#1d3349;--accent-ink:#0f151b;
    --ok:#6fcf9b;--ok-soft:#173527;--warn:#e9b25f;--warn-soft:#3a2c14;--bad:#f08a82;--bad-soft:#3d1c1a;--info:#b3a9f0;--info-soft:#2a2547}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
  h1{font-size:1.3rem;margin:0}
  h2{font-size:1.1rem;margin:0}
  h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
  .top small{color:var(--muted);font-size:.8rem}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs a{flex:1;text-align:center;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;text-decoration:none}
  .tabs a[aria-current=page]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:0 0 4px}
  input,textarea,select{display:block;width:100%;min-width:0;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;-webkit-appearance:none;appearance:none}
  input[type=date],input[type=time]{min-height:46px;line-height:1.2}
  input::-webkit-date-and-time-value{text-align:left}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px;margin-bottom:12px}.row>div{flex:1;min-width:0}
  .f{margin-bottom:12px}
  .btn{display:inline-block;padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
  .btn.full{width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer;text-decoration:none;display:inline-block}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:10px}
  .muted{color:var(--muted)}
  .msg{min-height:1.2em;margin-top:8px;font-size:.9rem}.msg.err{color:var(--bad)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .seg{display:inline-flex;flex-wrap:wrap;gap:4px}
  .seg button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  /* statuts */
  .chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .s-afaire{background:var(--warn-soft);color:var(--warn)} .s-encours{background:var(--info-soft);color:var(--info)}
  .s-enattente{background:var(--sunk);color:var(--muted)} .s-termine{background:var(--ok-soft);color:var(--ok)}
  .late{color:var(--bad);font-weight:700}
  /* immeubles */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  a.imm{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
  a.imm:hover{border-color:var(--accent)}
  a.imm.vide{opacity:.6}
  .imm .code{display:inline-block;font:600 .8rem ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px;margin-bottom:6px}
  .imm .nom{font-weight:700;line-height:1.25}
  .imm .ville{font-size:.82rem;color:var(--muted)}
  .imm .cpt{margin-top:8px;font-size:.88rem}
  /* actions */
  a.act{display:block;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:11px 13px;margin-bottom:8px;color:var(--ink);text-decoration:none}
  a.act.st-encours{border-left-color:var(--info)} a.act.st-enattente{border-left-color:var(--line)} a.act.st-termine{border-left-color:var(--ok);opacity:.65}
  a.act.retard{border-left-color:var(--bad)}
  .act .t{font-weight:600}
  .act .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:4px}
  .act .n{font-size:.88rem;margin-top:4px}
  .tag{font:600 .75rem ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px}
  /* fiche */
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pills button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
  .pills button[aria-pressed=true]{border-color:currentColor;font-weight:700}
  .pills button.s-afaire[aria-pressed=true]{background:var(--warn-soft);color:var(--warn)}
  .pills button.s-encours[aria-pressed=true]{background:var(--info-soft);color:var(--info)}
  .pills button.s-enattente[aria-pressed=true]{background:var(--sunk);color:var(--ink)}
  .pills button.s-termine[aria-pressed=true]{background:var(--ok-soft);color:var(--ok)}
  .pills button:not([aria-pressed=true]){background:var(--card);color:var(--muted)}
  .contact{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .contact:first-child{border-top:0}
  .contact .nm{font-weight:600}
  .contact .rl{font-size:.85rem;color:var(--muted)}
  .contact .lk{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:3px;font-size:.92rem}
  .contact a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
  .del{background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;padding:4px;align-self:flex-start;white-space:nowrap}
  .del.sure{color:var(--bad);font-weight:700}
  .jr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .jr:first-child{border-top:0}
  .jr .ic{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.95rem}
  .jr .h{font-size:.82rem;color:var(--muted)}
  .jr .r{overflow-wrap:anywhere;white-space:pre-wrap}
  details.add>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
  details.add>summary::-webkit-details-marker{display:none}
  details.add[open]>summary{margin-bottom:10px}
  .empty{color:var(--muted);font-size:.95rem;padding:6px 0}
  .savebar{position:sticky;bottom:12px;z-index:3}
  /* heures */
  .duree{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nav{display:flex;align-items:center;gap:6px}
  .nav button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer}
  .nav span{min-width:8.5em;text-align:center;font-weight:600}
  .total{font-size:1.6rem;font-weight:700;margin:8px 0 4px}
  .total small{font-size:.9rem;font-weight:500;color:var(--muted)}
  .entry{padding:10px 0;border-top:1px solid var(--line)}
  .entry .l1{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
  .entry .lieu{font-size:.9rem;font-weight:600;margin-top:2px}
  .entry .trav{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
  .toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Suivi projets</h1><small id="etat"></small></div>
  <nav class="tabs">
    <a href="#actions" id="tab-actions">Suivi des actions</a>
    <a href="#heures" id="tab-heures">Suivi des heures</a>
  </nav>
  <div id="vue"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Adresse de l'application Apps Script (Déployer > Nouveau déploiement > Application Web)
const API_URL = 'https://script.google.com/macros/s/AKfycbwxck4dhHnRoHFjlIWbN4VynuajLYN9Suv5LH0g18LEXrq7hR9_e4ipYmnxHXSzMgdu/exec';

const STATUTS = ['À faire','En cours','En attente','Terminé'];
const SCL = s => 's-' + (s||'À faire').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s/g,'').toLowerCase();
const TYPES = {Appel:'📞', Email:'✉️', Visite:'🏠', Note:'📝'};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
const auj = () => new Date().toLocaleDateString('sv-SE');
const fd = s => s ? new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const fdc = s => s ? new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'}) : '';
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const enRetard = a => a.deadline && a.deadline < auj() && a.statut !== 'Terminé';
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

let code = store.get('code_projets');
function demanderCode(){ code = prompt("Code d'accès :") || ''; store.set('code_projets', code); }
if(!code) demanderCode();

// ---------- données ----------
let D = null;
try{ D = JSON.parse(store.get('cache_projets') || 'null'); }catch(e){}
let chargeEnCours = false;

async function charger(){
  const avait = !!D;
  chargeEnCours = true; $('etat').textContent = 'Synchronisation…';
  try{
    const r = await fetch(`${API_URL}?quoi=tout&code=${encodeURIComponent(code)}`);
    const d = await r.json();
    if(!d.ok){ if(d.erreur==='code'){ store.del('code_projets'); demanderCode(); return charger(); } throw new Error(d.erreur); }
    D = d; store.set('cache_projets', JSON.stringify(d));
    $('etat').textContent = '';
  }catch(e){
    $('etat').textContent = D ? 'Hors ligne · données en cache' : '';
    if(!D) $('vue').innerHTML = '<div class="card empty">Impossible de charger les données. Vérifiez la connexion puis rechargez la page.</div>';
  }
  chargeEnCours = false;
  // ne redessine pas un écran où l'on est en train de saisir
  const h0 = (location.hash || '#actions').slice(1).split('/')[0];
  if(D && (!avait || h0 === 'actions' || h0 === 'immeuble')) route();
}

async function envoyer(op, data){
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({code, op, ...data}) });
  const d = await r.json();
  if(!d.ok){ if(d.erreur==='code'){ store.del('code_projets'); demanderCode(); } throw new Error(d.erreur); }
  store.set('cache_projets', JSON.stringify(D));
  return d;
}
const imm = c => (D.immeubles||[]).find(i => i.code === c);
const actionsDe = c => D.actions.filter(a => a.immeuble === c);
const dernierJournal = id => D.journal.filter(j => j.action === id).sort((a,b) => b.date.localeCompare(a.date))[0];

// ---------- navigation ----------
let sale = false;   // modifications non enregistrées sur une fiche
let filtre = store.get('filtre_projets') || 'ouvertes';
let ignorer = false;
window.addEventListener('hashchange', () => {
  if(ignorer){ ignorer = false; return; }
  if(sale && !confirm('Des modifications ne sont pas enregistrées. Quitter quand même ?')){ ignorer = true; history.back(); return; }
  sale = false; route(); window.scrollTo(0,0);
});
function route(){
  const h = (location.hash || '#actions').slice(1).split('/');
  const heures = h[0] === 'heures';
  [['tab-actions',!heures],['tab-heures',heures]].forEach(([t,on]) => on ? $(t).setAttribute('aria-current','page') : $(t).removeAttribute('aria-current'));
  if(heures) return vueHeures();
  if(!D){ $('vue').innerHTML = '<div class="card empty">Chargement…</div>'; return; }
  if(h[0] === 'immeuble' && imm(h[1])) return vueImmeuble(h[1]);
  if(h[0] === 'action' && D.actions.find(a => a.id === h[1])) return vueAction(h[1]);
  if(h[0] === 'nouvelle') return vueNouvelle(h[1] || '');
  vueAccueil();
}

// ---------- accueil : immeubles ----------
function vueAccueil(){
  const ouv = D.actions.filter(a => a.statut !== 'Terminé');
  const ret = ouv.filter(enRetard);
  const cartes = D.immeubles.map(i => {
    const as = actionsDe(i.code).filter(a => a.statut !== 'Terminé');
    const r = as.filter(enRetard).length;
    return { i, n: as.length, r };
  }).sort((a,b) => (b.n>0) - (a.n>0));
  const autres = ouv.filter(a => !imm(a.immeuble));
  $('vue').innerHTML = `
    <div class="bar"><div><strong>${ouv.length}</strong> action${ouv.length>1?'s':''} en cours${ret.length?` · <span class="late">${ret.length} en retard</span>`:''}</div>
      <a class="btn" href="#nouvelle">+ Nouvelle action</a></div>
    <div class="grid">${cartes.map(({i,n,r}) => `
      <a class="imm${n?'':' vide'}" href="#immeuble/${i.code}">
        <span class="code">${esc(i.code)}</span>
        <div class="nom">${esc(i.nom)}</div><div class="ville">${esc(i.ville)}</div>
        <div class="cpt">${n ? `<strong>${n}</strong> action${n>1?'s':''} en cours` : '<span class="muted">Aucune action</span>'}${r?` · <span class="late">${r} en retard</span>`:''}</div>
      </a>`).join('')}</div>
    ${autres.length ? `<h3>Sans immeuble</h3>${autres.map(carteAction).join('')}` : ''}`;
}

function carteAction(a){
  const j = dernierJournal(a.id); const r = enRetard(a);
  return `<a class="act ${SCL(a.statut).replace('s-','st-')}${r?' retard':''}" href="#action/${a.id}">
    <div class="t">${esc(a.titre)}</div>
    <div class="m"><span class="chip ${SCL(a.statut)}">${esc(a.statut)}</span>
      ${a.deadline ? `<span class="${r?'late':''}">Deadline ${fd(a.deadline)}${r?' · en retard':''}</span>` : ''}</div>
    ${a.prochaine ? `<div class="n">➜ ${esc(a.prochaine)}</div>` : ''}
    ${j ? `<div class="m">${TYPES[j.type]||''} ${fd(j.date)} · ${esc(j.resume.length>90 ? j.resume.slice(0,90)+'…' : j.resume)}</div>` : ''}
  </a>`;
}

// ---------- immeuble ----------
function vueImmeuble(c){
  const i = imm(c);
  let as = actionsDe(c);
  const nTerm = as.filter(a => a.statut === 'Terminé').length;
  if(filtre === 'ouvertes') as = as.filter(a => a.statut !== 'Terminé');
  const ordre = a => [a.statut==='Terminé'?1:0, a.deadline||'9999', a.titre].join('|');
  as.sort((x,y) => ordre(x) < ordre(y) ? -1 : 1);
  $('vue').innerHTML = `
    <a class="back" href="#actions">‹ Tous les immeubles</a>
    <div class="bar"><div><span class="tag">${esc(i.code)}</span> <h2 style="display:inline">${esc(i.nom)}</h2><div class="muted" style="font-size:.88rem">${esc(i.ville)}</div></div>
      <a class="btn" href="#nouvelle/${i.code}">+ Action</a></div>
    <div class="bar"><div class="seg" role="group" aria-label="Filtre">
      <button type="button" data-f="ouvertes" aria-pressed="${filtre==='ouvertes'}">En cours</button>
      <button type="button" data-f="toutes" aria-pressed="${filtre==='toutes'}">Toutes${nTerm?` (dont ${nTerm} terminée${nTerm>1?'s':''})`:''}</button></div></div>
    ${as.length ? as.map(carteAction).join('') : `<div class="card empty">${filtre==='ouvertes' ? 'Aucune action en cours pour cet immeuble.' : 'Aucune action pour cet immeuble.'}</div>`}`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtre = b.dataset.f; store.set('filtre_projets', filtre); vueImmeuble(c); });
}

// ---------- fiche action ----------
function vueAction(id){
  const a = D.actions.find(x => x.id === id);
  const i = imm(a.immeuble);
  const contacts = D.contacts.filter(x => x.action === id);
  const journal = D.journal.filter(x => x.action === id).sort((x,y) => (y.date + y.id).localeCompare(x.date + x.id));
  const tousContacts = {}; D.contacts.forEach(x => { if(x.nom) tousContacts[x.nom] = x; });
  $('vue').innerHTML = `
    <a class="back" href="${i ? '#immeuble/'+i.code : '#actions'}">‹ ${i ? esc(i.nom) : 'Retour'}</a>
    <form class="card" id="fiche" autocomplete="off">
      <div class="f"><label for="a-titre">Action</label><input id="a-titre" value="${esc(a.titre)}" required></div>
      <div class="f"><label>Statut</label><div class="pills" id="a-statut">${STATUTS.map(s => `<button type="button" class="${SCL(s)}" data-s="${esc(s)}" aria-pressed="${a.statut===s}">${esc(s)}</button>`).join('')}</div></div>
      <div class="row">
        <div><label for="a-deadline">Deadline</label><input type="date" id="a-deadline" value="${esc(a.deadline)}"></div>
        <div><label for="a-imm">Immeuble</label><select id="a-imm">${optionsImm(a.immeuble)}</select></div>
      </div>
      <div class="f"><label for="a-prochaine">Prochaine étape</label><input id="a-prochaine" value="${esc(a.prochaine)}" placeholder="ex. Rappeler M. Benita vendredi pour la date d'intervention"></div>
      <div class="f"><label for="a-notes">Notes</label><textarea id="a-notes" rows="4">${esc(a.notes)}</textarea></div>
      <div class="savebar"><button class="btn full" id="a-save" disabled>Enregistrer les modifications</button></div>
      <div class="msg" id="a-msg"></div>
    </form>

    <h3>Contacts</h3>
    <div class="card">
      <div id="lst-contacts">${contacts.length ? contacts.map(ligneContact).join('') : '<div class="empty">Aucun contact pour cette action.</div>'}</div>
      <details class="add" id="add-contact"><summary>+ Ajouter un contact</summary>
        <form id="f-contact" autocomplete="off">
          <div class="row"><div><label for="c-nom">Nom</label><input id="c-nom" list="dl-contacts" placeholder="ex. M. Benita" required></div>
            <div><label for="c-role">Rôle</label><input id="c-role" placeholder="ex. Chauffagiste"></div></div>
          <div class="row"><div><label for="c-tel">Téléphone</label><input id="c-tel" type="tel" inputmode="tel"></div>
            <div><label for="c-mail">Email</label><input id="c-mail" type="email" inputmode="email"></div></div>
          <datalist id="dl-contacts">${Object.keys(tousContacts).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
          <button class="btn full">Ajouter le contact</button>
        </form>
      </details>
    </div>

    <h3>Journal (appels, emails, visites)</h3>
    <div class="card">
      <form id="f-journal" autocomplete="off" style="margin-bottom:6px">
        <div class="f"><div class="seg" id="j-type" role="group" aria-label="Type">${Object.entries(TYPES).map(([t,ic],k) => `<button type="button" data-t="${t}" aria-pressed="${k===0}">${ic} ${t}</button>`).join('')}</div></div>
        <div class="row"><div style="flex:0 0 11em"><label for="j-date">Date</label><input type="date" id="j-date" value="${auj()}"></div></div>
        <div class="f"><label for="j-resume">Résumé</label><textarea id="j-resume" rows="2" placeholder="ex. Appelé M. Benita : passe mardi 14h pour finir le raccordement" required></textarea></div>
        <button class="btn full">Ajouter au journal</button>
      </form>
      <div id="lst-journal" style="margin-top:12px">${journal.length ? journal.map(ligneJournal).join('') : '<div class="empty">Rien de noté pour l’instant.</div>'}</div>
    </div>`;

  // fiche : détecter les modifications
  let statut = a.statut;
  const marquer = () => { sale = true; $('a-save').disabled = false; $('a-msg').textContent = ''; };
  ['a-titre','a-deadline','a-imm','a-prochaine','a-notes'].forEach(k => $(k).addEventListener('input', marquer));
  $('a-statut').querySelectorAll('button').forEach(b => b.onclick = () => {
    statut = b.dataset.s; $('a-statut').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); marquer();
  });
  $('fiche').onsubmit = async ev => {
    ev.preventDefault();
    const champs = { titre: $('a-titre').value.trim(), statut, deadline: $('a-deadline').value, immeuble: $('a-imm').value,
      prochaine: $('a-prochaine').value.trim(), notes: $('a-notes').value.trim() };
    if(!champs.titre){ $('a-msg').className='msg err'; $('a-msg').textContent='Le titre ne peut pas être vide.'; return; }
    $('a-save').disabled = true; $('a-msg').className='msg'; $('a-msg').textContent='Enregistrement…';
    try{
      const avant = {...a}; Object.assign(a, champs, {maj: auj()});
      try{ await envoyer('majAction', {id, champs}); }catch(e){ Object.assign(a, avant); throw e; }
      sale = false; $('a-msg').textContent = 'Enregistré.'; setTimeout(() => { if($('a-msg')) $('a-msg').textContent=''; }, 2500);
    }catch(e){ $('a-msg').className='msg err'; $('a-msg').textContent='Erreur, réessayez.'; $('a-save').disabled=false; }
  };

  // contacts
  $('c-nom').addEventListener('change', () => { const c = tousContacts[$('c-nom').value]; if(c){ if(!$('c-role').value) $('c-role').value=c.role; if(!$('c-tel').value) $('c-tel').value=c.telephone; if(!$('c-mail').value) $('c-mail').value=c.email; } });
  $('f-contact').onsubmit = async ev => {
    ev.preventDefault();
    const c = { id: nid('C'), action: id, nom: $('c-nom').value.trim(), role: $('c-role').value.trim(), telephone: $('c-tel').value.trim(), email: $('c-mail').value.trim() };
    if(!c.nom) return;
    D.contacts.push(c); vueActionPartielle(id);
    try{ await envoyer('ajouterContact', c); toast('Contact ajouté'); }
    catch(e){ D.contacts = D.contacts.filter(x => x.id !== c.id); vueActionPartielle(id); toast('Erreur : contact non enregistré'); }
  };

  // journal
  let jtype = 'Appel';
  $('j-type').querySelectorAll('button').forEach(b => b.onclick = () => { jtype = b.dataset.t; $('j-type').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('f-journal').onsubmit = async ev => {
    ev.preventDefault();
    const j = { id: nid('J'), action: id, date: $('j-date').value || auj(), type: jtype, resume: $('j-resume').value.trim() };
    if(!j.resume) return;
    D.journal.push(j); $('j-resume').value = ''; vueActionPartielle(id);
    try{ await envoyer('ajouterJournal', j); toast('Ajouté au journal'); }
    catch(e){ D.journal = D.journal.filter(x => x.id !== j.id); vueActionPartielle(id); toast('Erreur : entrée non enregistrée'); }
  };
  brancherSuppressions(id);
}

// redessine uniquement les listes de contacts et de journal (garde la saisie de la fiche)
function vueActionPartielle(id){
  const contacts = D.contacts.filter(x => x.action === id);
  const journal = D.journal.filter(x => x.action === id).sort((x,y) => (y.date + y.id).localeCompare(x.date + x.id));
  $('lst-contacts').innerHTML = contacts.length ? contacts.map(ligneContact).join('') : '<div class="empty">Aucun contact pour cette action.</div>';
  $('lst-journal').innerHTML = journal.length ? journal.map(ligneJournal).join('') : '<div class="empty">Rien de noté pour l’instant.</div>';
  if($('f-contact')){ $('f-contact').reset(); $('add-contact').open = false; }
  brancherSuppressions(id);
}
function brancherSuppressions(id){
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'Confirmer ?'; setTimeout(() => { b.classList.remove('sure'); b.textContent = 'Supprimer'; }, 3000); return; }
    const [quoi, did] = b.dataset.del.split('|');
    const liste = quoi === 'contact' ? 'contacts' : 'journal';
    const garde = D[liste]; D[liste] = garde.filter(x => x.id !== did); vueActionPartielle(id);
    try{ await envoyer('supprimer', {quoi, id: did}); toast('Supprimé'); }
    catch(e){ D[liste] = garde; vueActionPartielle(id); toast('Erreur : suppression non faite'); }
  });
}
function ligneContact(c){
  const tel = c.telephone ? `<a href="tel:${esc(c.telephone.replace(/[^\d+]/g,''))}">📞 ${esc(c.telephone)}</a>` : '';
  const mail = c.email ? `<a href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>` : '';
  return `<div class="contact"><div style="min-width:0"><div class="nm">${esc(c.nom)}</div>${c.role?`<div class="rl">${esc(c.role)}</div>`:''}<div class="lk">${tel}${mail}</div></div>
    <button type="button" class="del" data-del="contact|${esc(c.id)}">Supprimer</button></div>`;
}
function ligneJournal(j){
  return `<div class="jr"><div class="ic" aria-hidden="true">${TYPES[j.type]||'📝'}</div>
    <div style="min-width:0"><div class="h">${esc(j.type)} · ${fdc(j.date)}</div><div class="r">${esc(j.resume)}</div></div>
    <button type="button" class="del" data-del="journal|${esc(j.id)}">Supprimer</button></div>`;
}
function optionsImm(sel){
  return `<option value="">— Sans immeuble —</option>` + D.immeubles.map(i => `<option value="${esc(i.code)}"${i.code===sel?' selected':''}>${esc(i.code)} · ${esc(i.nom)}</option>`).join('');
}

// ---------- nouvelle action ----------
function vueNouvelle(c){
  $('vue').innerHTML = `
    <a class="back" href="${imm(c) ? '#immeuble/'+c : '#actions'}">‹ Annuler</a>
    <form class="card" id="f-new" autocomplete="off">
      <h2 style="margin-bottom:12px">Nouvelle action</h2>
      <div class="f"><label for="n-imm">Immeuble</label><select id="n-imm">${optionsImm(c)}</select></div>
      <div class="f"><label for="n-titre">Action</label><input id="n-titre" placeholder="ex. Trouver un plombier pour la colonne d'eau" required></div>
      <div class="row"><div><label for="n-deadline">Deadline</label><input type="date" id="n-deadline"></div><div></div></div>
      <div class="f"><label for="n-prochaine">Prochaine étape</label><input id="n-prochaine" placeholder="ex. Demander 3 devis"></div>
      <div class="f"><label for="n-notes">Notes</label><textarea id="n-notes"></textarea></div>
      <button class="btn full" id="n-ok">Créer l’action</button>
      <div class="msg" id="n-msg"></div>
    </form>`;
  $('n-titre').focus();
  $('f-new').onsubmit = async ev => {
    ev.preventDefault();
    const a = { id: nid('A'), immeuble: $('n-imm').value, titre: $('n-titre').value.trim(), statut: 'À faire',
      deadline: $('n-deadline').value, prochaine: $('n-prochaine').value.trim(), notes: $('n-notes').value.trim(), cree: auj(), maj: auj() };
    if(!a.titre) return;
    $('n-ok').disabled = true; $('n-msg').className='msg'; $('n-msg').textContent = 'Création…';
    try{
      D.actions.push(a);
      try{ await envoyer('ajouterAction', a); }catch(e){ D.actions = D.actions.filter(x => x.id !== a.id); throw e; }
      location.hash = '#action/' + a.id;
    }catch(e){ $('n-ok').disabled = false; $('n-msg').className='msg err'; $('n-msg').textContent = 'Erreur, réessayez.'; }
  };
}

// ---------- heures ----------
const now = new Date();
let mois = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const minutes = h => { const [a,b] = h.split(':').map(Number); return a*60 + b; };
const fmtH = n => n.toLocaleString('fr-FR', {maximumFractionDigits: 2}) + ' h';
const fmtHM = n => { const m = Math.round(n*60); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`; };
const fmtMois = k => { const [y,m] = k.split('-'); const t = new Date(y, m-1, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'}); return t.charAt(0).toUpperCase() + t.slice(1); };
const decaler = (k, n) => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

function vueHeures(){
  $('vue').innerHTML = `
    <form class="card" id="form-h" autocomplete="off">
      <div class="f"><label for="h-date">Date</label><input type="date" id="h-date" value="${auj()}" required></div>
      <div class="row">
        <div><label for="h-debut">Début</label><input type="time" id="h-debut" required></div>
        <div><label for="h-fin">Fin</label><input type="time" id="h-fin" required></div>
      </div>
      <div class="duree" id="h-duree"></div>
      <div class="f"><label for="h-lieu">Lieu</label><input id="h-lieu" list="dl-lieux" placeholder="ex. Charrue d'Or, bureau, déplacement…" required>
        <datalist id="dl-lieux">${(D ? D.immeubles : []).map(i => `<option value="${esc(i.nom)}">`).join('')}</datalist></div>
      <div class="f"><label for="h-travail">Travail réalisé</label><textarea id="h-travail" placeholder="ex. Visite Grostenquin avec le façadier, relance devis VMC" required></textarea></div>
      <button class="btn full" id="h-ok">Enregistrer</button>
      <div class="msg" id="h-msg"></div>
    </form>
    <section class="card">
      <div class="head"><h2>Heures du mois</h2>
        <div class="nav"><button type="button" id="prec" aria-label="Mois précédent">‹</button><span id="libMois"></span><button type="button" id="suiv" aria-label="Mois suivant">›</button></div></div>
      <div class="total" id="total"></div>
      <div id="liste"><div class="empty">Chargement…</div></div>
    </section>`;
  const majDuree = () => {
    const d = $('h-debut').value, f = $('h-fin').value;
    if(!d || !f){ $('h-duree').textContent=''; return; }
    const diff = minutes(f) - minutes(d);
    $('h-duree').textContent = diff > 0 ? 'Durée : ' + fmtHM(diff/60) : 'La fin doit être après le début.';
  };
  const effacer = () => { $('h-msg').textContent=''; $('h-msg').className='msg'; };
  ['h-date','h-debut','h-fin','h-lieu','h-travail'].forEach(k => $(k).addEventListener('input', () => { effacer(); if(k==='h-debut'||k==='h-fin') majDuree(); }));
  $('prec').onclick = () => { mois = decaler(mois,-1); chargerHeures(); };
  $('suiv').onclick = () => { mois = decaler(mois,1); chargerHeures(); };
  $('form-h').onsubmit = async ev => {
    ev.preventDefault();
    const debut = $('h-debut').value, fin = $('h-fin').value;
    if(minutes(fin) <= minutes(debut)){ $('h-msg').className='msg err'; $('h-msg').textContent='La fin doit être après le début.'; return; }
    $('h-ok').disabled = true; $('h-msg').className='msg'; $('h-msg').textContent='Enregistrement…';
    try{
      await envoyer('ajouterHeure', { date: $('h-date').value, debut, fin, lieu: $('h-lieu').value.trim(), travail: $('h-travail').value.trim() });
      $('h-msg').textContent = 'Heures enregistrées.'; setTimeout(effacer, 4000);
      mois = $('h-date').value.slice(0,7);
      $('form-h').reset(); $('h-date').value = auj(); majDuree();
      chargerHeures();
    }catch(e){ $('h-msg').className='msg err'; $('h-msg').textContent='Erreur, réessayez.'; }
    finally{ $('h-ok').disabled = false; }
  };
  chargerHeures();
}
let reqH = 0;
async function chargerHeures(){
  const n = ++reqH;
  $('libMois').textContent = fmtMois(mois); $('total').textContent = '';
  $('liste').innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const r = await fetch(`${API_URL}?quoi=heures&mois=${mois}&code=${encodeURIComponent(code)}`);
    const d = await r.json();
    if(n !== reqH || !$('liste')) return;
    if(!d.ok) throw new Error(d.erreur);
    const L = d.lignes.sort((a,b) => (b.date+b.debut).localeCompare(a.date+a.debut));
    const tot = L.reduce((s,l) => s + l.duree, 0);
    $('total').innerHTML = `${fmtHM(tot)} <small>(${fmtH(tot)} · ${L.length} intervention${L.length>1?'s':''})</small>`;
    $('liste').innerHTML = L.length ? L.map(l => `<div class="entry"><div class="l1"><span>${fdc(l.date)} · ${esc(l.debut)} – ${esc(l.fin)}</span><b>${fmtHM(l.duree)}</b></div>
      <div class="lieu">${esc(l.lieu)}</div><div class="trav">${esc(l.travail)}</div></div>`).join('') : '<div class="empty">Aucune heure saisie ce mois-ci.</div>';
  }catch(e){ if(n === reqH && $('liste')) $('liste').innerHTML = '<div class="empty">Impossible de charger les heures.</div>'; }
}

// ---------- démarrage ----------
route();
charger();
</script>
</body>
</html>
