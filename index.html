<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi projets</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icone_192.png">
<link rel="apple-touch-icon" href="icone_apple.png">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projets">
<style>
  /* Outil de chantier : listes verticales lisibles sur téléphone, l'urgence portée par une bande de couleur à gauche */
  :root{--bg:#f3f5f7;--card:#fff;--sunk:#e8ecf0;--ink:#17212b;--muted:#5b6876;--line:#d9dfe5;--accent:#1f4e79;--accent-soft:#dbe6f1;--accent-ink:#fff;
    --ok:#1f7a4d;--ok-soft:#dcefe4;--warn:#a15c00;--warn-soft:#f6e8cf;--bad:#b3261e;--bad-soft:#f6dcda;--info:#5a4fa3;--info-soft:#e5e2f5;--next:#fff7e0;--next-line:#ecd9a0;--sujet:#d7ecea;--sujet-ink:#14514c}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f151b;--card:#16202a;--sunk:#1d2935;--ink:#e4eaf0;--muted:#97a6b5;--line:#2b3a48;--accent:#8db8e3;--accent-soft:#1d3349;--accent-ink:#0f151b;
    --ok:#6fcf9b;--ok-soft:#173527;--warn:#e9b25f;--warn-soft:#3a2c14;--bad:#f08a82;--bad-soft:#3d1c1a;--info:#b3a9f0;--info-soft:#2a2547;--next:#2a2412;--next-line:#4a3f1e;--sujet:#173a37;--sujet-ink:#9fdcd4}}
  :root[data-theme=dark]{color-scheme:dark;--bg:#0f151b;--card:#16202a;--sunk:#1d2935;--ink:#e4eaf0;--muted:#97a6b5;--line:#2b3a48;--accent:#8db8e3;--accent-soft:#1d3349;--accent-ink:#0f151b;
    --ok:#6fcf9b;--ok-soft:#173527;--warn:#e9b25f;--warn-soft:#3a2c14;--bad:#f08a82;--bad-soft:#3d1c1a;--info:#b3a9f0;--info-soft:#2a2547;--next:#2a2412;--next-line:#4a3f1e;--sujet:#173a37;--sujet-ink:#9fdcd4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:1.3rem;margin:0}
  h2{font-size:1.1rem;margin:0;text-wrap:balance}
  h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
  h3 .n{font-weight:500}
  a{color:var(--accent)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
  .top small{color:var(--muted);font-size:.8rem}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs a{flex:1;text-align:center;padding:11px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;text-decoration:none}
  .tabs a[aria-current=page]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:0 0 4px}
  input,textarea,select{display:block;width:100%;min-width:0;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  input[type=date],input[type=time]{min-height:46px;line-height:1.2}
  input::-webkit-date-and-time-value{text-align:left}
  textarea{min-height:70px;resize:vertical}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:10px;margin-bottom:12px}.row>div{flex:1;min-width:0}
  .f{margin-bottom:12px}
  .btn{display:inline-block;padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
  .btn.full{width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:10px}
  .muted{color:var(--muted)}
  .msg{min-height:1.2em;margin-top:8px;font-size:.9rem}.msg.err{color:var(--bad)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .filters{align-items:center}
  .filters select{width:auto;flex:1 1 150px;padding-block:8px;font-size:.92rem}
  .seg{display:inline-flex;flex-wrap:wrap;gap:4px}
  .seg button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  /* urgence */
  .u{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .u-urgent{background:var(--bad-soft);color:var(--bad)} .u-peu{background:var(--warn-soft);color:var(--warn)} .u-occasion{background:var(--sunk);color:var(--muted)}
  /* statut */
  .st{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .st-encours{border-color:var(--info);color:var(--info)} .st-termine{border-color:var(--ok);color:var(--ok)}
  .late{color:var(--bad);font-weight:700}
  .tag{font:600 .75rem ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px}
  /* liste verticale */
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .li{border-top:1px solid var(--line);position:relative}
  .li:first-child{border-top:0}
  .li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
  .li.ur-urgent::before{background:var(--bad)} .li.ur-peu::before{background:var(--warn)}
  .li.fini{opacity:.6}
  .li-lien{display:block;padding:12px 14px 10px 18px;color:var(--ink);text-decoration:none}
  .li-lien:hover{background:var(--sunk)}
  .li-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .fin{font-size:.78rem;font-weight:700;color:var(--ok)}
  .li-titre{margin-top:6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;line-height:1.25}
  .logt{font-size:1.12rem;font-weight:800;letter-spacing:-.01em}
  .act{font-size:.98rem;font-weight:700;color:var(--sujet-ink);background:var(--sujet);border-radius:6px;padding:2px 9px}
  .resp{display:block;margin-top:5px;font-size:.86rem;font-weight:700;color:var(--ink)}
  .resp.vide{font-weight:400;font-style:italic;color:var(--muted)}
  .resp-f{margin-top:8px}
  .resp-f label{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;font-size:.82rem}
  .next{margin-top:8px;background:var(--next);border:1px solid var(--next-line);border-radius:7px;padding:6px 9px;font-size:.93rem}
  .next b{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;display:block;color:var(--warn)}
  .next.vide{background:transparent;border-style:dashed;color:var(--muted);font-style:italic}
  .pers{margin-top:6px;font-size:.9rem;color:var(--ink)}
  .li-next{display:block;margin:0 14px 10px 18px;text-decoration:none;color:inherit}
  a.li-next.vide{color:var(--muted)}
  .done{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 12px 6px 8px;border:1px solid var(--ok);border-radius:999px;color:var(--ok);font-weight:700;font-size:.9rem;cursor:pointer;background:var(--card);text-transform:none;letter-spacing:0}
  .done input{width:20px;height:20px;margin:0;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--ok);cursor:pointer}
  .f-next label.done{color:var(--ok);font-size:.9rem;text-transform:none;letter-spacing:0}
  details.passees{padding:0 14px 10px 18px}
  details.passees>summary,details.passees-fiche>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;list-style:none;display:inline-flex;gap:6px;align-items:baseline}
  details.passees>summary::-webkit-details-marker,details.passees-fiche>summary::-webkit-details-marker{display:none}
  details.passees>summary::before,details.passees-fiche>summary::before{content:"▸";transition:transform .15s;display:inline-block}
  details[open].passees>summary::before,details[open].passees-fiche>summary::before{transform:rotate(90deg)}
  details.passees .jr{padding:8px 0}
  details.passees-fiche>summary{font-size:1rem}
  .n{color:var(--muted);font-weight:500}
  .chk{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted);margin:0}
  .chk input{width:18px;height:18px;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
  .fiche-h{margin:2px 0 12px}
  .fiche-h .logt{font-size:1.3rem}
  .fiche-h .act{font-size:1.15rem}
  button.lien{background:none;border:0;padding:6px 0 0;color:var(--ok);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-align:left}
  .btn.sec{background:var(--card);color:var(--ok);border:1px solid var(--ok)}
  .lien-c{display:inline-block;margin-top:8px;font-weight:600;text-decoration:none}
  /* fiche */
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pills button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer}
  .pills button[aria-pressed=true]{font-weight:700;border-color:currentColor;color:var(--ink);background:var(--sunk)}
  .pills button.u-urgent[aria-pressed=true]{background:var(--bad-soft);color:var(--bad)}
  .pills button.u-peu[aria-pressed=true]{background:var(--warn-soft);color:var(--warn)}
  .pills button.st-encours[aria-pressed=true]{background:var(--info-soft);color:var(--info)}
  .pills button.st-termine[aria-pressed=true]{background:var(--ok-soft);color:var(--ok)}
  .pills button.u,.pills button.st{text-transform:none;letter-spacing:0;font-size:.9rem;padding:8px 12px}
  .pills button:not([aria-pressed=true]){background:var(--card);color:var(--muted);border-color:var(--line);font-weight:400}
  .f-next label{color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.76rem}
  .f-next input,.f-next textarea{background:var(--next);border-color:var(--next-line);font-weight:600}
  /* contacts */
  .contact{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .contact:first-child{border-top:0}
  .contact .nm{font-weight:600}
  .contact .rl{font-size:.85rem;color:var(--muted)}
  .contact .lk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;font-size:.92rem}
  .contact a{text-decoration:none;overflow-wrap:anywhere}
  .contact .nolk{font-size:.85rem;color:var(--muted);font-style:italic}
  .del{background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;padding:4px;align-self:flex-start;white-space:nowrap}
  .del.sure{color:var(--bad);font-weight:700}
  .grp{margin-bottom:12px}
  .grp-h{display:flex;flex-direction:column;gap:2px;margin:18px 0 6px}
  .grp-h h2{font-size:1rem}
  .grp-h small{color:var(--muted)}
  /* journal */
  .jr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .jr:first-child{border-top:0}
  .jr .ic{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.95rem}
  .jr .h{font-size:.82rem;color:var(--muted)}
  .jr .r{overflow-wrap:anywhere;white-space:pre-wrap}
  details.add>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
  details.add>summary::-webkit-details-marker{display:none}
  details.add[open]>summary{margin-bottom:10px}
  .empty{color:var(--muted);font-size:.95rem;padding:6px 0}
  .list .empty{padding:14px}
  /* heures */
  .duree{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .nav{display:flex;align-items:center;gap:6px}
  .nav button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer}
  .nav span{min-width:8.5em;text-align:center;font-weight:600}
  .total{font-size:1.6rem;font-weight:700;margin:8px 0 4px;font-variant-numeric:tabular-nums}
  .total small{font-size:.9rem;font-weight:500;color:var(--muted)}
  .entry{padding:10px 0;border-top:1px solid var(--line)}
  .entry .l1{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;font-variant-numeric:tabular-nums}
  .entry .lieu{font-size:.9rem;font-weight:600;margin-top:2px}
  .entry .trav{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Suivi projets</h1><small id="etat"></small></div>
  <nav class="tabs">
    <a href="#actions" id="tab-actions">Actions</a>
    <a href="#contacts" id="tab-contacts">Contacts</a>
    <a href="#heures" id="tab-heures">Heures</a>
  </nav>
  <div id="vue"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Adresse de l'application Apps Script (Déployer > Nouveau déploiement > Application Web)
const API_URL = 'https://script.google.com/macros/s/AKfycbwZ37ENRfc8mahitVPfi5tgvJ-rex3ZPHljSQtM7bhG2GVxAeQiEgW48nsfCFqjBNYm/exec';

const URGENCES = ['Urgent','Peu urgent','À l’occasion'];
const UCL = u => ({'Urgent':'urgent','Peu urgent':'peu'}[u] || 'occasion');
const URANG = u => ({'Urgent':0,'Peu urgent':1}[u] ?? 2);
const EQUIPE = ['Raph','Florian','Simon'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
const auj = () => new Date().toLocaleDateString('sv-SE');
const fd = s => s ? new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const fdc = s => s ? new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'}) : '';
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), m.startsWith('Erreur') ? 9000 : 2200); }

let code = store.get('code_projets');
function demanderCode(){ code = prompt("Code d'accès :") || ''; store.set('code_projets', code); }
if(!code) demanderCode();

// ---------- données ----------
let D = null;
try{ D = JSON.parse(store.get('cache_projets') || 'null'); }catch(e){}

async function charger(){
  const avait = !!D;
  $('etat').textContent = 'Synchronisation…';
  try{
    const r = await fetch(`${API_URL}?quoi=tout&code=${encodeURIComponent(code)}`);
    const d = await r.json();
    if(!d.ok){ if(d.erreur==='code'){ store.del('code_projets'); demanderCode(); return charger(); } throw new Error(d.erreur); }
    D = d; store.set('cache_projets', JSON.stringify(d));
    $('etat').textContent = '';
  }catch(e){
    $('etat').textContent = D ? 'Hors ligne · données en cache' : '';
    if(!D) $('vue').innerHTML = '<div class="card empty">Impossible de charger les données. Vérifiez la connexion puis rechargez la page.</div>';
  }
  const v = vueCourante().vue;
  if(D && (!avait || ['actions','contacts'].includes(v))) route();
}
async function envoyer(op, data){
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({code, op, ...data}) });
  const brut = await r.text();
  let d; try{ d = JSON.parse(brut); }catch(e){ const m = brut.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').match(/(Exception|Error|Erreur)[^.]{0,160}/i); throw new Error(m ? m[0] : 'réponse inattendue du script (HTTP ' + r.status + ')'); }
  if(!d.ok){ if(d.erreur==='code'){ store.del('code_projets'); demanderCode(); } throw new Error(d.erreur); }
  store.set('cache_projets', JSON.stringify(D));
  return d;
}
const imm = c => (D.immeubles||[]).find(i => i.code === c);
const personnes = () => [...new Set(EQUIPE.concat(D.contacts.map(c => c.nom).filter(Boolean)))];
const optionsResp = sel => `<option value="">— À attribuer —</option>` + personnes().concat(sel && !personnes().includes(sel) ? [sel] : []).map(n => `<option${n===sel?' selected':''}>${esc(n)}</option>`).join('');
const rangImm = c => { const k = D.immeubles.findIndex(i => i.code === c); return k < 0 ? 99 : k; };
const etapesDe = id => D.etapes.filter(j => j.action === id).sort((a,b) => ((b.date||'0000')+b.id).localeCompare((a.date||'0000')+a.id));
const trier = as => as.sort((x,y) => (!!x.terminee - !!y.terminee) || URANG(x.urgence) - URANG(y.urgence) || rangImm(x.immeuble) - rangImm(y.immeuble) || (x.lot||'').localeCompare(y.lot||'', 'fr', {numeric:true}) || x.titre.localeCompare(y.titre));

// ---------- navigation ----------
let sale = false, ignorer = false;
let F = { imm: store.get('pf_imm') || '', urg: store.get('pf_urg') || '', resp: store.get('pf_resp') || '', fini: store.get('pf_fini') === '1' };
window.addEventListener('hashchange', () => {
  if(ignorer){ ignorer = false; return; }
  if(sale && !confirm('Des modifications ne sont pas enregistrées. Quitter quand même ?')){ ignorer = true; history.back(); return; }
  sale = false; route(); window.scrollTo(0,0);
});
function vueCourante(){
  const hh = (location.hash || '#actions').slice(1); const k = hh.indexOf('-');
  return k < 0 ? {vue: hh, arg: ''} : {vue: hh.slice(0,k), arg: hh.slice(k+1)};
}
function route(){
  const {vue, arg} = vueCourante();
  const onglet = vue === 'heures' ? 'heures' : vue === 'contacts' ? 'contacts' : 'actions';
  ['actions','contacts','heures'].forEach(t => t === onglet ? $('tab-'+t).setAttribute('aria-current','page') : $('tab-'+t).removeAttribute('aria-current'));
  if(vue === 'heures') return vueHeures();
  if(!D){ $('vue').innerHTML = '<div class="card empty">Chargement…</div>'; return; }
  if(vue === 'contacts') return vueContacts();
  if(vue === 'action' && D.actions.find(a => a.id === arg)) return vueAction(arg);
  if(vue === 'nouvelle') return vueNouvelle(arg);
  vueListe();
}

// ---------- une action dans la liste ----------
function ligneAction(a){
  const i = imm(a.immeuble); const ep = etapesDe(a.id);
  return `<div class="li ur-${UCL(a.urgence)}${a.terminee?' fini':''}">
    <a class="li-lien" href="#action-${a.id}">
      <div class="li-top"><span class="u u-${UCL(a.urgence)}">${esc(a.urgence)}</span>${a.terminee ? '<span class="fin">Terminée</span>' : ''}</div>
      <div class="li-titre"><span class="logt">${esc(i ? i.nom : 'Sans logement')}${a.lot ? ` · ${esc(a.lot)}` : ''}</span><span class="act">${esc(a.titre)}</span></div>
      ${a.personnes ? `<div class="pers">👥 ${esc(a.personnes)}</div>` : ''}
    </a>
    ${a.prochaine ? `<div class="next li-next"><b>Prochaine étape</b>${esc(a.prochaine)}<span class="resp${a.responsable?'':' vide'}">👤 ${a.responsable ? esc(a.responsable) : 'Responsable à désigner'}</span>
        <label class="done"><input type="checkbox" data-fait="${a.id}"> Étape terminée</label></div>`
      : (!a.terminee ? `<a class="next vide li-next" href="#action-${a.id}">Prochaine étape à définir ›</a>` : '')}
    ${ep.length ? `<details class="passees"><summary>Étapes passées <span class="n">${ep.length}</span></summary>${ep.map(j => ligneEtape(j)).join('')}</details>` : ''}
  </div>`;
}
function ligneEtape(j, suppr){
  return `<div class="jr"><div class="ic" aria-hidden="true">✔︎</div>
    <div style="min-width:0">${j.date ? `<div class="h">${fd(j.date)}</div>` : ''}<div class="r">${esc(j.texte)}</div></div>
    ${suppr ? `<button type="button" class="del" data-del="etape|${esc(j.id)}">Supprimer</button>` : '<span></span>'}</div>`;
}

// ---------- liste des actions ----------
function vueListe(){
  let as = D.actions.slice();
  if(!F.fini) as = as.filter(a => !a.terminee);
  if(F.imm) as = as.filter(a => a.immeuble === F.imm);
  if(F.urg) as = as.filter(a => a.urgence === F.urg);
  if(F.resp) as = as.filter(a => F.resp === '-' ? !a.responsable : a.responsable === F.resp);
  trier(as);
  const resps = [...new Set(EQUIPE.concat(D.actions.map(a => a.responsable).filter(Boolean).sort((x,y) => x.localeCompare(y,'fr'))))];
  if(F.resp && F.resp !== '-' && !resps.includes(F.resp)) resps.push(F.resp);
  const ouv = D.actions.filter(a => !a.terminee);
  const nu = ouv.filter(a => a.urgence === 'Urgent').length;
  const groupes = URGENCES.map(u => [u, as.filter(a => a.urgence === u && !a.terminee)]).concat([['Terminées', as.filter(a => a.terminee)]]);
  $('vue').innerHTML = `
    <div class="bar"><div><strong>${ouv.length}</strong> action${ouv.length>1?'s':''} en cours${nu ? ` · <span class="late">${nu} urgente${nu>1?'s':''}</span>` : ''}</div>
      <a class="btn" href="#nouvelle${F.imm ? '-'+F.imm : ''}">+ Nouvelle action</a></div>
    <div class="filters">
      <select id="fl-imm" aria-label="Logement"><option value="">Tous logements</option>${D.immeubles.map(i => `<option value="${esc(i.code)}"${F.imm===i.code?' selected':''}>${esc(i.nom)}</option>`).join('')}</select>
      <select id="fl-urg" aria-label="Urgence"><option value="">Toutes urgences</option>${URGENCES.map(u => `<option${F.urg===u?' selected':''}>${esc(u)}</option>`).join('')}</select>
      <select id="fl-resp" aria-label="Responsable"><option value="">Tous responsables</option>${resps.map(r => `<option value="${esc(r)}"${F.resp===r?' selected':''}>👤 ${esc(r)}</option>`).join('')}<option value="-"${F.resp==='-'?' selected':''}>Sans responsable</option></select>
      <label class="chk"><input type="checkbox" id="fl-fini"${F.fini?' checked':''}> Afficher les terminées</label>
    </div>
    ${as.length ? groupes.filter(([,l]) => l.length).map(([u,l]) => `<h3>${esc(u)} <span class="n">${l.length}</span></h3><div class="list">${l.map(ligneAction).join('')}</div>`).join('')
      : '<div class="card empty">Aucune action pour ces filtres.</div>'}`;
  document.querySelectorAll('[data-fait]').forEach(c => c.onchange = async () => {
    const a = D.actions.find(x => x.id === c.dataset.fait); c.disabled = true;
    if(await terminerEtape(a)) location.hash = '#action-' + a.id; else { c.checked = false; c.disabled = false; }
  });
  $('fl-imm').onchange = () => { F.imm = $('fl-imm').value; store.set('pf_imm', F.imm); vueListe(); };
  $('fl-urg').onchange = () => { F.urg = $('fl-urg').value; store.set('pf_urg', F.urg); vueListe(); };
  $('fl-resp').onchange = () => { F.resp = $('fl-resp').value; store.set('pf_resp', F.resp); vueListe(); };
  $('fl-fini').onchange = () => { F.fini = $('fl-fini').checked; store.set('pf_fini', F.fini ? '1' : '0'); vueListe(); };
}

// ---------- fiche action ----------
function vueAction(id){
  const a = D.actions.find(x => x.id === id);
  const i = imm(a.immeuble);
  const ep = etapesDe(id);
  $('vue').innerHTML = `
    <a class="back" href="#actions">‹ Toutes les actions</a>
    <div class="fiche-h"><span class="u u-${UCL(a.urgence)}" id="h-urg">${esc(a.urgence)}</span>
      <div class="li-titre"><span class="logt">${esc(i ? i.nom : 'Sans logement')}${a.lot ? ` · ${esc(a.lot)}` : ''}</span><span class="act">${esc(a.titre)}</span></div></div>
    <form class="card" id="fiche" autocomplete="off">
      <div class="f"><label>Urgence</label><div class="pills" id="a-urg">${URGENCES.map(u => `<button type="button" class="u u-${UCL(u)}" data-v="${esc(u)}" aria-pressed="${a.urgence===u}">${esc(u)}</button>`).join('')}</div></div>
      <div class="row">
        <div><label for="a-imm">Logement</label><select id="a-imm">${optionsImm(a.immeuble)}</select></div>
        <div style="flex:0 0 38%"><label for="a-lot">Logement n° / étage</label><input id="a-lot" value="${esc(a.lot)}" placeholder="ex. Logement 20, 1er étage"></div>
      </div>
      <div class="f"><label for="a-titre">Action</label><input id="a-titre" value="${esc(a.titre)}" required></div>
      <div class="f"><label for="a-pers">Personnes impliquées</label><input id="a-pers" value="${esc(a.personnes)}" placeholder="ex. Gerald Benitah, Simon"></div>
      <div class="f"><label for="a-notes">Commentaire</label><textarea id="a-notes" rows="3">${esc(a.notes)}</textarea></div>
      <div class="f f-next"><label for="a-prochaine">Prochaine étape</label><textarea id="a-prochaine" rows="2" placeholder="ex. Faire passer les intervenants">${esc(a.prochaine)}</textarea>
        <div class="resp-f"><label for="a-resp">Responsable de la prochaine étape</label><select id="a-resp">${optionsResp(a.responsable)}</select></div>
        ${a.prochaine ? `<label class="done"><input type="checkbox" id="a-faite"> Étape terminée</label>` : ''}</div>
      <button class="btn full" id="a-save" disabled>Enregistrer les modifications</button>
      <div class="msg" id="a-msg"></div>
    </form>

    <details class="card passees-fiche" id="d-etapes"><summary>Étapes passées <span class="n" id="n-etapes">${ep.length}</span></summary>
      <div id="lst-etapes" style="margin-top:12px">${listeEtapes(ep)}</div>
    </details>

    <button type="button" class="btn full ${a.terminee ? '' : 'sec'}" id="a-fin" style="margin-top:6px">${a.terminee ? 'Rouvrir l’action' : '✔︎ Marquer l’action comme terminée'}</button>`;

  let urgence = a.urgence;
  const marquer = () => { sale = true; $('a-save').disabled = false; $('a-msg').textContent = ''; };
  ['a-titre','a-imm','a-lot','a-prochaine','a-resp','a-pers','a-notes'].forEach(k => $(k).addEventListener('input', marquer));
  $('a-urg').querySelectorAll('button').forEach(b => b.onclick = () => { urgence = b.dataset.v; $('a-urg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); marquer(); });
  const lireChamps = () => ({ titre: $('a-titre').value.trim(), urgence, immeuble: $('a-imm').value, lot: $('a-lot').value.trim(),
      prochaine: $('a-prochaine').value.trim(), responsable: $('a-resp').value, personnes: $('a-pers').value.trim(), notes: $('a-notes').value.trim() });
  async function sauver(champs, msgOk){
    const avant = {...a}; Object.assign(a, champs, {maj: auj()});
    try{ await envoyer('majAction', {id, champs}); sale = false; return true; }
    catch(e){ Object.assign(a, avant); toast('Erreur : ' + e.message); return false; }
  }
  $('fiche').onsubmit = async ev => {
    ev.preventDefault();
    const champs = lireChamps();
    if(!champs.titre){ $('a-msg').className='msg err'; $('a-msg').textContent='Le titre ne peut pas être vide.'; return; }
    $('a-save').disabled = true; $('a-msg').className='msg'; $('a-msg').textContent='Enregistrement…';
    if(await sauver(champs)){ vueAction(id); toast('Enregistré'); } else { $('a-save').disabled = false; $('a-msg').textContent=''; }
  };
  if($('a-faite')) $('a-faite').onchange = async () => {
    $('a-faite').disabled = true;
    if(await terminerEtape(a, lireChamps())){ sale = false; vueAction(id); $('d-etapes').open = true; $('a-prochaine').focus(); }
    else { $('a-faite').checked = false; $('a-faite').disabled = false; }
  };
  $('a-fin').onclick = async () => { if(await sauver({terminee: !a.terminee})){ toast(a.terminee ? 'Action terminée' : 'Action rouverte'); location.hash = '#actions'; } };

  brancherSuppressions(() => majEtapes(id));
}
// « Étape terminée » : la prochaine étape part dans les étapes passées, datée du jour
async function terminerEtape(a, champs){
  champs = champs || {};
  const texte = (champs.prochaine ?? a.prochaine).trim(), resp = champs.responsable ?? a.responsable;
  if(!texte) return false;
  const j = { id: nid('E'), action: a.id, date: auj(), texte: texte + (resp ? ` (${resp})` : '') };
  const maj = { ...champs, prochaine: '', responsable: '' };
  const avant = {...a};
  D.etapes.push(j); Object.assign(a, maj, {maj: auj()});
  try{ await envoyer('ajouterEtape', j); await envoyer('majAction', {id: a.id, champs: maj}); }
  catch(e){ D.etapes = D.etapes.filter(x => x.id !== j.id); Object.assign(a, avant); toast('Erreur : ' + e.message); return false; }
  toast(`Étape passée le ${fd(j.date)} · indiquez la prochaine étape`);
  return true;
}
function listeEtapes(ep){ return ep.length ? ep.map(j => ligneEtape(j, true)).join('') : '<div class="empty">Aucune étape passée pour l’instant.</div>'; }
function majEtapes(id){ const ep = etapesDe(id); $('lst-etapes').innerHTML = listeEtapes(ep); $('n-etapes').textContent = ep.length; brancherSuppressions(() => majEtapes(id)); }
function brancherSuppressions(apres){
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'Confirmer ?'; setTimeout(() => { b.classList.remove('sure'); b.textContent = 'Supprimer'; }, 3000); return; }
    const [quoi, did] = b.dataset.del.split('|');
    const liste = quoi === 'contact' ? 'contacts' : 'etapes';
    const garde = D[liste]; D[liste] = garde.filter(x => x.id !== did); apres();
    try{ await envoyer('supprimer', {quoi, id: did}); toast('Supprimé'); }
    catch(e){ D[liste] = garde; apres(); toast('Erreur : suppression non faite'); }
  });
}
function optionsImm(sel){
  return `<option value="">— Sans logement —</option>` + D.immeubles.map(i => `<option value="${esc(i.code)}"${i.code===sel?' selected':''}>${esc(i.nom)}</option>`).join('');
}

// ---------- contacts ----------
function ligneContact(c){
  const tel = c.telephone ? `<a href="tel:${esc(c.telephone.replace(/[^\d+]/g,''))}">📞 ${esc(c.telephone)}</a>` : '';
  const mail = c.email ? `<a href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>` : '';
  return `<div class="contact"><div style="min-width:0"><div class="nm">${esc(c.nom)}</div>${c.fonction?`<div class="rl">${esc(c.fonction)}</div>`:''}
    <div class="lk">${tel}${mail}${!tel && !mail ? '<span class="nolk">Téléphone et email à compléter</span>' : ''}</div></div>
    <button type="button" class="del" data-del="contact|${esc(c.id)}">Supprimer</button></div>`;
}
function vueContacts(){
  const cs = D.contacts.slice().sort((x,y) => x.nom.localeCompare(y.nom, 'fr'));
  $('vue').innerHTML = `
    <div class="card">
      <details class="add" id="add-contact"><summary>+ Ajouter un contact</summary>
        <form id="f-contact" autocomplete="off">

        </form>

  $('f-contact').onsubmit = async ev => {
    ev.preventDefault();
    const c = { id: nid('C'), nom: $('c-nom').value.trim(), fonction: $('c-fct').value.trim(), telephone: $('c-tel').value.trim(), email: $('c-mail').value.trim() };
    if(!c.nom) return;

  brancherSuppressions(vueContacts);
}

// ---------- heures ----------
const now = new Date();
let mois = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const minutes = h => { const [a,b] = h.split(':').map(Number); return a*60 + b; };
const fmtH = n => n.toLocaleString('fr-FR', {maximumFractionDigits: 2}) + ' h';
const fmtHM = n => { const m = Math.round(n*60); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`; };
const fmtMois = k => { const [y,m] = k.split('-'); const t = new Date(y, m-1, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'}); return t.charAt(0).toUpperCase() + t.slice(1); };
const decaler = (k, n) => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

function vueHeures(){
  $('vue').innerHTML = `
    <form class="card" id="form-h" autocomplete="off">
      <div class="f"><label for="h-date">Date</label><input type="date" id="h-date" value="${auj()}" required></div>
      <div class="row">
        <div><label for="h-debut">Début</label><input type="time" id="h-debut" required></div>
        <div><label for="h-fin">Fin</label><input type="time" id="h-fin" required></div>
      </div>
      <div class="duree" id="h-duree"></div>
      <div class="f"><label for="h-lieu">Lieu</label><input id="h-lieu" list="dl-lieux" placeholder="ex. Charrue d'Or, bureau, déplacement…" required>
        <datalist id="dl-lieux">${(D ? D.immeubles : []).map(i => `<option value="${esc(i.nom)}">`).join('')}</datalist></div>
      <div class="f"><label for="h-travail">Travail réalisé</label><textarea id="h-travail" placeholder="ex. Visite Grostenquin avec le façadier, relance devis VMC" required></textarea></div>
      <button class="btn full" id="h-ok">Enregistrer</button>
      <div class="msg" id="h-msg"></div>
    </form>
    <section class="card">
      <div class="head"><h2>Heures du mois</h2>
        <div class="nav"><button type="button" id="prec" aria-label="Mois précédent">‹</button><span id="libMois"></span><button type="button" id="suiv" aria-label="Mois suivant">›</button></div></div>
      <div class="total" id="total"></div>
      <div id="liste"><div class="empty">Chargement…</div></div>
    </section>`;
  const majDuree = () => {
    const d = $('h-debut').value, f = $('h-fin').value;
    if(!d || !f){ $('h-duree').textContent=''; return; }
    const diff = minutes(f) - minutes(d);
    $('h-duree').textContent = diff > 0 ? 'Durée : ' + fmtHM(diff/60) : 'La fin doit être après le début.';
  };
  const effacer = () => { if(!$('h-msg')) return; $('h-msg').textContent=''; $('h-msg').className='msg'; };
  ['h-date','h-debut','h-fin','h-lieu','h-travail'].forEach(k => $(k).addEventListener('input', () => { effacer(); if(k==='h-debut'||k==='h-fin') majDuree(); }));
  $('prec').onclick = () => { mois = decaler(mois,-1); chargerHeures(); };
  $('suiv').onclick = () => { mois = decaler(mois,1); chargerHeures(); };
  $('form-h').onsubmit = async ev => {
    ev.preventDefault();
    const debut = $('h-debut').value, fin = $('h-fin').value;
    if(minutes(fin) <= minutes(debut)){ $('h-msg').className='msg err'; $('h-msg').textContent='La fin doit être après le début.'; return; }
    $('h-ok').disabled = true; $('h-msg').className='msg'; $('h-msg').textContent='Enregistrement…';
    try{
      await envoyer('ajouterHeure', { date: $('h-date').value, debut, fin, lieu: $('h-lieu').value.trim(), travail: $('h-travail').value.trim() });
      $('h-msg').textContent = 'Heures enregistrées.'; setTimeout(effacer, 4000);
      mois = $('h-date').value.slice(0,7);
      $('form-h').reset(); $('h-date').value = auj(); majDuree();
      chargerHeures();
    }catch(e){ $('h-msg').className='msg err'; $('h-msg').textContent='Erreur, réessayez.'; }
    finally{ $('h-ok').disabled = false; }
  };
  chargerHeures();
}
let reqH = 0;
async function chargerHeures(){
  const n = ++reqH;
  $('libMois').textContent = fmtMois(mois); $('total').textContent = '';
  $('liste').innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const r = await fetch(`${API_URL}?quoi=heures&mois=${mois}&code=${encodeURIComponent(code)}`);
    const d = await r.json();
    if(n !== reqH || !$('liste')) return;
    if(!d.ok) throw new Error(d.erreur);
    const L = d.lignes.sort((a,b) => (b.date+b.debut).localeCompare(a.date+a.debut));
    const tot = L.reduce((s,l) => s + l.duree, 0);
    $('total').innerHTML = `${fmtHM(tot)} <small>(${fmtH(tot)} · ${L.length} intervention${L.length>1?'s':''})</small>`;
    $('liste').innerHTML = L.length ? L.map(l => `<div class="entry"><div class="l1"><span>${fdc(l.date)} · ${esc(l.debut)} – ${esc(l.fin)}</span><b>${fmtHM(l.duree)}</b></div>
      <div class="lieu">${esc(l.lieu)}</div><div class="trav">${esc(l.travail)}</div></div>`).join('') : '<div class="empty">Aucune heure saisie ce mois-ci.</div>';
  }catch(e){ if(n === reqH && $('liste')) $('liste').innerHTML = '<div class="empty">Impossible de charger les heures.</div>'; }
}

// ---------- démarrage ----------
route();
charger();
</script>
